# Lint (Biome), vérification des types, audit, build (Vite) puis déploiement sur GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Aucune permission par défaut : chaque job déclare le strict nécessaire.
permissions: {}

# Un seul déploiement à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA de commit complet (mises à jour par Dependabot).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts : aucun script d'installation (postinstall...) des dépendances n'est exécuté.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit des dépendances
        run: npm audit --audit-level=high

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Aucune clé API dans le build : le site publié appelle le proxy météo
      # hébergé sur Vercel (la clé OpenWeatherMap reste côté serveur).
      - name: Build
        run: npm run build
        env:
          VITE_WEATHER_API_BASE: https://meteoci.vercel.app/api/weather

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
